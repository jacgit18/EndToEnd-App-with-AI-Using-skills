# Dependabot version updates (free). Weekly, minor+patch grouped, at most 5 open PRs each.
version: 2
updates:
  - package-ecosystem: npm
    directory: /finance-dashboard/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /finance-dashboard/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      uv-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /finance-dashboard/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      docker-backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /finance-dashboard/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      docker-frontend-minor-patch:
        update-types: [minor, patch]
