<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal finance dashboard: accounts, transactions, budgets and a monthly summary." />
    <title>Finance Dashboard</title>
    <!-- Inline on purpose: a separate 0.4 kB stylesheet is a render-blocking request that cost
         about 0.3 s of mobile LCP in Lighthouse. Touch targets: WCAG 2.2 AAA (2.5.5) asks for 44x44 CSS px. -->
    <style>
      button,
      select,
      input:not([type="checkbox"]):not([type="radio"]) {
        min-height: 44px;
        box-sizing: border-box;
      }
      button {
        min-width: 44px;
        padding-inline: 0.75rem;
      }
      a {
        display: inline-block;
        min-height: 44px;
        line-height: 44px;
        padding-inline: 0.25rem;
      }
      /* The wrapping <label> is the 44px target for a checkbox or radio. */
      label:has(> input[type="checkbox"]),
      label:has(> input[type="radio"]) {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-height: 44px;
      }
      input[type="checkbox"],
      input[type="radio"] {
        width: 24px;
        height: 24px;
        margin: 0;
      }
      /* Visible keyboard focus (WCAG 2.2 AAA 2.4.13: at least 2px, 3:1 against the page). */
      :focus-visible,
      input:focus-within {
        outline: 3px solid #0b57d0;
        outline-offset: 2px;
      }
      /* Chart text and lines follow the page's text colour. Visx hard-codes dark grey/black,
         which vanishes on a dark background or in forced-colors mode. Bar fills stay as is:
         every charted value is also in the table under the chart. */
      svg text {
        fill: currentColor;
      }
      svg line,
      svg path {
        stroke: currentColor;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
