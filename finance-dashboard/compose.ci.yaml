# Override for the real-stack smoke + Lighthouse run (scripts/real-stack.sh). Layered on
# compose.prod.yaml so the stack under test is the production one: same images, same
# Caddyfile.prod, ENV=prod (Secure session cookie), migrations run on boot.
#
# What it changes, and why:
#  * login + secret come from env vars the script generates (never the owner's real
#    backend/.env.prod, which is not read here);
#  * Caddy publishes on 127.0.0.1:8081, so it can run beside the real prod stack on 8080;
#  * the stack is started under its own project name (-p finance-ci) so its database
#    volume is a throwaway, never finance-prod's.
services:
  backend:
    env_file: !reset []
    environment:
      AUTH_EMAIL: ${CI_AUTH_EMAIL}
      AUTH_PASSWORD_HASH: ${CI_AUTH_PASSWORD_HASH}
      SESSION_SECRET: ${CI_SESSION_SECRET}
  web:
    ports: !override
      - "127.0.0.1:8081:80"
