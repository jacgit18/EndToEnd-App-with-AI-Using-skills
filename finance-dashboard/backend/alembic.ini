[alembic]
# Where migration scripts live, relative to this file.
script_location = migrations

# Migration filenames get a date prefix so `ls` sorts them chronologically,
# in addition to Alembic's own revision-chain ordering.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Deliberately no `sqlalchemy.url` here. The real URL comes from
# `settings.database_url` (app/config.py) via migrations/env.py, so the
# connection string lives in exactly one place — not duplicated into a
# committed .ini file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
