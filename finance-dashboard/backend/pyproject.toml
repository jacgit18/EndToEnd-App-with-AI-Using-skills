[project]
name = "finance-dashboard-backend"
version = "0.1.0"
description = "Personal finance dashboard — FastAPI backend"
requires-python = ">=3.13"

# Runtime dependencies. Each maps to a decision ADR under docs/architecture/decisions/.
dependencies = [
    "fastapi>=0.115",          # web framework (ADR-0003)
    "uvicorn[standard]>=0.30",  # ASGI server that runs FastAPI
    "sqlalchemy>=2.0.30",       # ORM / query layer, 2.0 API (ADR-0006)
    "alembic>=1.13",            # database migrations (ADR-0006)
    "psycopg[binary]>=3.2",     # PostgreSQL driver, psycopg 3 (ADR-0004)
    "pydantic-settings>=2.2",   # load + validate config from env vars (ADR-0002, ADR-0014)
    "argon2-cffi>=23.1",        # hash + verify AUTH_PASSWORD_HASH (Phase 1, ADR-0010)
    "itsdangerous>=2.2",        # sign the session-id cookie value (Phase 1, ADR-0014's
                                 # "session signing secret") — the session id itself stays an
                                 # opaque DB lookup key either way; this only stops a tampered
                                 # or guessed cookie value from reaching that lookup at all
    "sentry-sdk>=2.0",          # error tracking, inert unless SENTRY_DSN is set (ADR-0013;
                                 # free tier — see docs/paid-options.md)
]

# Dev-only: installed locally and in CI, never in the runtime image.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",   # required by FastAPI's TestClient (ADR-0016 integration tests)
]

# Added in later phases, not needed yet:
#   a rate-limiting library (or a hand-rolled limiter) — login rate limiting (Phase 1, ADR-0010)
#   python-multipart   — file upload for CSV import          (Phase 5, S5)
#   sentry-sdk         — error tracking                       (Phase 1, ADR-0013)

# No [build-system] table on purpose: this is an application, not a library.
# uv manages the virtualenv and dependencies; it never builds/installs this project
# as a package. (ADR-0011)

# There's no [build-system], so `app/` is never installed as a package — pytest
# needs to be told where it lives. `pythonpath = ["."]` puts backend/ (this
# file's directory) on sys.path so `import app.config` etc. resolves when
# pytest is run from here, same as it does when uvicorn runs the app itself.
[tool.pytest.ini_options]
pythonpath = ["."]
