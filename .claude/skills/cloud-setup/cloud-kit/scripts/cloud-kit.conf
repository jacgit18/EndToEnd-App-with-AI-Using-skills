# Cloud kit settings for ONE project. Committed; no secrets. Plain KEY=value lines, read as data (not run): no quotes, a trailing  # comment is allowed.
# Edit every value, then set KIT_CONFIGURED=yes. Every value is checked against a strict pattern before any script uses it.
KIT_CONFIGURED=no
APP_SLUG=example-app          # lowercase letters, digits, hyphen; 3 to 24 chars; prefix of every resource name
REPO_NAME=example-app         # Artifact Registry repository
DB_ROLE=example_app           # runtime database role: ^[a-z][a-z0-9_]{2,40}$
MARK_KEY=example-app-env      # database comment key: "<MARK_KEY>:<qa|production>"
LOG_NAME=example-app-deploy   # Cloud Logging log name (read by the project's deploy script)
REGION=us-east4               # Google Cloud region
NEON_REGION=aws-us-east-1     # Neon region id
PG_VERSION=17                 # Neon Postgres major version (also the docker image tag used for psql)
BUDGET_USD=5                  # monthly alert amount in USD, whole number
DISPLAY_NAME=Example-App      # letters, digits, hyphen, space; shown in the console
